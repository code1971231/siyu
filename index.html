<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#05070f" />
<meta name="format-detection" content="telephone=no" />
<title>给思羽 · 11.21</title>
<meta name="description" content="一份写在星图上的生日礼物。" />
<meta property="og:title" content="给思羽 · 11.21" />
<meta property="og:description" content="一份写在星图上的生日礼物。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l2.2 8.6L27 14l-8.8 2.4L16 25l-2.2-8.6L5 14l8.8-2.4z' fill='%23e7d3a9'/%3E%3C/svg%3E" />
<style>/* =========================================================
   给思羽 · 11.21
   一份写在星图上的生日礼物
   ========================================================= */

:root{
  --bg:#05070f;
  --ink:#0a1224;
  --gold:#c9a86a;
  --gold-2:#e7d3a9;
  --text:#ece6da;
  --muted:rgba(236,230,218,.52);
  --dim:rgba(236,230,218,.34);
  --paper:#f5ecd9;
  --seal:#a8392c;

  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Noto Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC","STSong",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;

  --ease:cubic-bezier(.22,.61,.36,1);
  --vh:1vh;
}

*,*::before,*::after{box-sizing:border-box;}

html,body{height:100%;margin:0;padding:0;}

html{-webkit-text-size-adjust:100%;}

body{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  -webkit-user-select:none;
  user-select:none;
}

/* ---------- 夜空底色 ---------- */
body::before{
  content:"";
  position:fixed;
  inset:-12%;
  z-index:0;
  background:
    radial-gradient(58% 46% at 24% 16%, rgba(52,80,158,.30), transparent 72%),
    radial-gradient(46% 38% at 84% 24%, rgba(118,66,138,.20), transparent 74%),
    radial-gradient(64% 52% at 50% 92%, rgba(26,66,104,.26), transparent 72%),
    radial-gradient(38% 30% at 8% 74%, rgba(150,110,66,.10), transparent 72%),
    linear-gradient(180deg,#05070f 0%,#070b18 48%,#04060d 100%);
  filter:blur(6px);
}

#sky{
  position:fixed;
  inset:0;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  pointer-events:none;
}

.atmos{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(128% 92% at 50% 44%, transparent 42%, rgba(2,4,10,.62) 100%);
}
.atmos--edge{
  background:
    linear-gradient(180deg, rgba(3,6,14,.72) 0%, rgba(3,6,14,0) 20%, rgba(3,6,14,0) 76%, rgba(3,6,14,.78) 100%);
}

.stage{
  position:fixed;
  inset:0;
  z-index:3;
}

/* ---------- 幕 ---------- */
.scene{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:calc(env(safe-area-inset-top) + 68px) 24px calc(env(safe-area-inset-bottom) + 84px);
  opacity:0;
  visibility:hidden;
  transform:translate3d(0,18px,0);
  transition:opacity .85s var(--ease), transform 1.05s var(--ease), visibility 0s linear .85s;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  pointer-events:none;
}
.scene.is-on{
  opacity:1;
  visibility:visible;
  transform:none;
  pointer-events:auto;
  transition:opacity 1s var(--ease), transform 1.15s var(--ease), visibility 0s;
}
.scene.is-past{transform:translate3d(0,-16px,0);}

.scene__inner{
  position:relative;
  width:min(100%,520px);
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.scene__inner--spread{justify-content:space-between;}

/* ---------- 通用字排 ---------- */
.eyebrow{
  margin:0;
  font-family:var(--sans);
  font-size:10px;
  font-weight:400;
  letter-spacing:.42em;
  text-indent:.42em;
  color:rgba(231,211,169,.66);
  text-transform:uppercase;
}
.eyebrow--dim{color:rgba(236,230,218,.30);}

.line{
  margin:0 0 .95em;
  font-family:var(--serif);
  font-size:clamp(18px,5.1vw,25px);
  font-weight:400;
  line-height:2.1;
  letter-spacing:.15em;
  text-indent:.15em;
  color:rgba(242,236,224,.94);
  text-wrap:balance;
}
.line--sm{font-size:clamp(14px,4vw,17px);letter-spacing:.2em;color:rgba(236,230,218,.55);}
.line--gold{color:var(--gold-2);}
.line:last-child{margin-bottom:0;}

.cap{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(21px,6.4vw,30px);
  letter-spacing:.22em;
  text-indent:.22em;
  color:#fbf3e2;
  text-shadow:0 0 26px rgba(255,224,164,.32);
}
.tiny{
  margin:0;
  font-size:10px;
  letter-spacing:.34em;
  text-indent:.34em;
  color:var(--dim);
  text-transform:uppercase;
}
.hint{
  margin:0;
  font-size:11px;
  letter-spacing:.28em;
  text-indent:.28em;
  color:rgba(236,230,218,.40);
  transition:opacity .8s ease;
}
.hint.is-gone{opacity:0;}

/* 逐条浮现 */
.rise{opacity:0;}
.scene.is-on .rise{
  animation:rise .95s var(--ease) both;
  animation-delay:var(--d,0ms);
}
@keyframes rise{
  from{opacity:0;transform:translate3d(0,14px,0);filter:blur(3px);}
  to{opacity:1;transform:none;filter:none;}
}

/* ---------- 封面 ---------- */
.cover{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.cover__rule{
  width:1px;
  height:46px;
  margin-bottom:26px;
  background:linear-gradient(180deg,rgba(201,168,106,0),rgba(201,168,106,.55));
}
.cover__name{
  margin:.06em 0 0;
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(58px,18vw,86px);
  line-height:1.1;
  letter-spacing:.3em;
  text-indent:.3em;
  color:#f8f1e3;
  text-shadow:0 0 40px rgba(255,226,168,.22);
}
.cover__sub{
  margin:22px 0 0;
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:.32em;
  text-indent:.32em;
  color:rgba(231,211,169,.7);
}
.cover__meta{
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:34px;
  font-size:10px;
  letter-spacing:.3em;
  text-indent:.3em;
  color:rgba(236,230,218,.42);
}
.cover__meta i{width:20px;height:1px;background:rgba(201,168,106,.38);}
.cover__clock{
  min-height:1.4em;
  margin:16px 0 0;
  font-size:10px;
  letter-spacing:.22em;
  color:rgba(236,230,218,.32);
  font-variant-numeric:tabular-nums;
}

/* 火漆印 */
.seal{
  position:relative;
  width:98px;
  height:98px;
  margin-top:46px;
  padding:0;
  border:0;
  border-radius:47% 53% 51% 49% / 51% 47% 53% 49%;
  cursor:pointer;
  color:#fbe9d6;
  font-family:var(--kai);
  font-size:24px;
  line-height:1.06;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  background:
    radial-gradient(circle at 33% 24%, #d9786a 0%, #bf5040 34%, #98332a 68%, #631d18 100%);
  box-shadow:
    0 16px 34px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,214,196,.16) inset,
    0 0 30px rgba(170,58,40,.28);
  transition:transform .6s var(--ease), opacity .6s ease, filter .6s ease;
  animation:sealBreath 4.6s ease-in-out infinite;
  -webkit-user-select:none;
  user-select:none;
}
.seal span{display:block;width:100%;text-align:center;}
.seal::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:
    radial-gradient(circle at 28% 78%, rgba(255,220,200,.18), transparent 42%),
    radial-gradient(circle at 72% 22%, rgba(255,230,210,.12), transparent 36%);
  pointer-events:none;
}
.seal::after{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:47% 53% 51% 49% / 51% 47% 53% 49%;
  border:1px dashed rgba(255,226,210,.28);
}
.seal:active{transform:scale(.95);}
.seal.is-open{
  transform:scale(1.35);
  opacity:0;
  filter:blur(8px);
  animation:none;
  pointer-events:none;
}
@keyframes sealBreath{
  0%,100%{box-shadow:0 16px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,214,196,.16) inset,0 0 24px rgba(170,58,40,.22);}
  50%{box-shadow:0 16px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,214,196,.24) inset,0 0 42px rgba(190,70,50,.42);}
}

/* ---------- 序 ---------- */
.scene--prologue .scene__inner{justify-content:flex-start;padding-top:8vh;}
.prologue{margin-top:2vh;}
.scene--prologue .hint{position:absolute;left:0;right:0;bottom:2vh;}

/* ---------- 星座 ---------- */
.scene--const .scene__inner{justify-content:space-between;padding-top:1vh;padding-bottom:1vh;}
.const__top,.const__bottom{display:flex;flex-direction:column;align-items:center;gap:14px;}
.const__top .line{margin-bottom:0;}
.const__gap{height:44vh;}

/* ---------- 初见 ---------- */
.scene--first .scene__inner{justify-content:center;}
.first{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.first__hero{
  margin:.14em 0 .1em;
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(46px,14vw,64px);
  line-height:1.2;
  letter-spacing:.34em;
  text-indent:.34em;
  color:#f8f1e3;
  text-shadow:0 0 40px rgba(255,226,168,.22);
}
.first__rule{
  width:1px;
  height:54px;
  margin:10px 0 28px;
  background:linear-gradient(180deg,rgba(201,168,106,.62),rgba(201,168,106,0));
}
.first__count{
  margin-top:36px;
  font-family:var(--serif);
  font-size:clamp(12.5px,3.7vw,14.5px);
  letter-spacing:.2em;
  text-indent:.2em;
  color:rgba(236,230,218,.5);
}
.first__count b{
  font-weight:400;
  font-size:1.6em;
  padding:0 .1em;
  color:#f3dda9;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 18px rgba(243,221,169,.3);
}

/* ---------- 两地 ---------- */
.scene--two .scene__inner{justify-content:center;}
.scene--two .eyebrow{margin-bottom:4px;}
.two__map{
  width:100%;
  max-width:400px;
  margin:20px auto 12px;
}
#mapCanvas{
  display:block;
  width:100%;
  height:auto;
}
.two__line{
  margin:4px 0 10px;
  font-family:var(--serif);
  font-size:clamp(20px,5.6vw,26px);
  letter-spacing:.2em;
  text-indent:.2em;
  color:rgba(245,239,227,.96);
}
.two__meta{
  margin:0 0 20px;
  font-size:11px;
  letter-spacing:.16em;
  color:rgba(236,230,218,.44);
}
.two__foot{
  margin:0;
  font-size:11px;
  letter-spacing:.2em;
  text-indent:.2em;
  color:rgba(201,168,106,.8);
}

/* ---------- 愿望 ---------- */
.scene--wish .scene__inner{justify-content:center;}
.wish__head{margin-bottom:26px;}
.wish__head .line{font-size:clamp(16px,4.6vw,20px);line-height:1.9;letter-spacing:.12em;margin-bottom:.4em;}
.wishes{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px 0;
  width:min(100%,340px);
  margin:24px auto 0;
}
.wish-star{
  appearance:none;
  border:0;
  padding:0;
  background:none;
  aspect-ratio:1/1;
  display:grid;
  place-items:center;
  cursor:pointer;
  color:rgba(236,226,206,.34);
  transition:color .5s ease, transform .35s var(--ease), filter .5s ease;
  -webkit-tap-highlight-color:transparent;
}
.wish-star svg{
  width:74%;
  height:74%;
  display:block;
  animation:wishTwinkle 5.4s ease-in-out infinite;
  animation-delay:var(--tw,0s);
}
@keyframes wishTwinkle{
  0%,100%{opacity:.7;transform:scale(.94);}
  50%{opacity:1;transform:scale(1);}
}
.wish-star:hover{color:rgba(247,226,174,.62);}
.wish-star:active{transform:scale(.86);}
.wish-star.is-lit{
  color:#f7e2ae;
  filter:drop-shadow(0 0 8px rgba(250,224,160,.7));
  animation:starPop .7s var(--ease);
}
.wish-star.is-lit svg{animation:none;opacity:1;}
@keyframes starPop{
  0%{transform:scale(.4);}
  55%{transform:scale(1.35);}
  100%{transform:scale(1);}
}
.wish-card{
  width:100%;
  min-height:132px;
  margin-top:22px;
  padding:2px 8px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:9px;
  text-align:center;
  font-family:var(--serif);
  font-size:clamp(15px,4.3vw,18px);
  line-height:1.95;
  letter-spacing:.08em;
  color:#f2ead9;
  opacity:0;
  transform:translate3d(0,8px,0);
  transition:opacity .7s ease, transform .7s var(--ease);
}
.wish-card > span:last-child{
  max-width:20em;
  text-wrap:balance;
}
.wish-card.is-on{opacity:1;transform:none;}
.wish-card__n{
  display:block;
  margin-bottom:0;
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.34em;
  text-indent:.34em;
  color:rgba(201,168,106,.6);
}
.wish__foot{
  margin-top:8px;
  min-height:1.2em;
  font-size:10px;
  letter-spacing:.24em;
  color:rgba(236,230,218,.36);
  transition:color .6s ease;
}
.wish__foot.is-full{color:rgba(247,226,174,.8);}

/* ---------- 信 ---------- */
.scene--letter .scene__inner{justify-content:center;}
.letter{
  position:relative;
  width:100%;
  max-width:420px;
  padding:32px 26px 28px;
  text-align:left;
  color:#3a2e22;
  font-family:var(--kai);
  font-size:clamp(13.5px,3.95vw,16px);
  line-height:2.1;
  letter-spacing:.05em;
  background:
    radial-gradient(120% 80% at 8% 0%, rgba(255,252,242,.9), transparent 60%),
    linear-gradient(158deg,#f7efdd 0%,#f0e3c9 52%,#e8d7b7 100%);
  transform:rotate(-.9deg);
  box-shadow:
    0 30px 64px rgba(0,0,0,.52),
    0 1px 0 rgba(255,255,255,.6) inset,
    0 0 0 1px rgba(120,92,52,.16);
  border-radius:2px;
}
.letter::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:2px;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg, rgba(122,92,52,.032) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 74% 22%, rgba(160,120,60,.08), transparent 42%);
  mix-blend-mode:multiply;
}
.letter::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:26px;
  background:linear-gradient(180deg,rgba(120,90,50,.14),transparent);
  border-radius:2px 2px 0 0;
}
.letter p{
  position:relative;
  z-index:1;
  margin:0 0 .78em;
  opacity:0;
}
.scene.is-on .letter p{
  animation:inkIn 1s var(--ease) both;
  animation-delay:var(--d,0ms);
}
@keyframes inkIn{
  from{opacity:0;filter:blur(4px);transform:translate3d(0,4px,0);}
  to{opacity:1;filter:none;transform:none;}
}
.letter__to{font-size:1.06em;letter-spacing:.14em;}
.letter__sign{
  margin-top:1.5em;
  text-align:right;
  line-height:1.95;
  letter-spacing:.08em;
}
.letter__sign span{
  display:block;
  margin-top:.2em;
  font-family:var(--sans);
  font-size:9px;
  letter-spacing:.24em;
  color:rgba(58,46,34,.5);
}

/* ---------- 证书 ---------- */
.scene--cert .scene__inner{justify-content:center;}
.cert{
  width:min(100%,352px);
  margin:0 auto;
  position:relative;
}
#certCanvas{
  display:block;
  width:100%;
  height:auto;
  border-radius:3px;
  box-shadow:0 28px 64px rgba(0,0,0,.6), 0 0 0 1px rgba(201,168,106,.12);
}
.cert__actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin-top:24px;
}

/* ---------- 按钮 ---------- */
.btn{
  appearance:none;
  border:1px solid rgba(201,168,106,.42);
  background:rgba(201,168,106,.07);
  color:#f0dfbf;
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.26em;
  text-indent:.26em;
  padding:12px 22px;
  border-radius:999px;
  cursor:pointer;
  transition:background .4s ease, border-color .4s ease, transform .4s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:rgba(201,168,106,.15);border-color:rgba(201,168,106,.62);}
.btn:active{transform:scale(.97);}
.btn--ghost{
  border-color:rgba(236,230,218,.18);
  background:none;
  color:rgba(236,230,218,.6);
}

/* ---------- 许愿 ---------- */
.scene--wishmake .scene__inner{justify-content:center;overflow:hidden;}
.wishmake__stage{
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:opacity 1s ease, transform 1s var(--ease), filter 1s ease;
}
.scene--wishmake.is-done .wishmake__stage{
  opacity:0;
  transform:translate3d(0,-16px,0);
  filter:blur(6px);
  pointer-events:none;
}
.orb-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.orb{
  position:relative;
  width:min(62vw,228px);
  aspect-ratio:1/1;
  display:grid;
  place-items:center;
  margin:26px 0 16px;
  background:none;
  border:0;
  padding:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
.orb::before{
  content:"";
  position:absolute;
  inset:31%;
  border-radius:50%;
  border:1px dashed rgba(201,168,106,.16);
  pointer-events:none;
}
.orb__ring{
  position:absolute;
  inset:0;
  transform:rotate(-90deg);
  overflow:visible;
}
.orb__track{
  fill:none;
  stroke:rgba(201,168,106,.16);
  stroke-width:1;
}
.orb__prog{
  fill:none;
  stroke:rgba(247,226,174,.85);
  stroke-width:1.6;
  stroke-linecap:round;
}
.orb::after{
  content:"";
  position:absolute;
  inset:16%;
  border-radius:50%;
  border:1px solid rgba(201,168,106,.20);
  animation:orbPulse 3.4s ease-out infinite;
  pointer-events:none;
}
@keyframes orbPulse{
  0%{transform:scale(.86);opacity:.65;}
  70%{transform:scale(1.16);opacity:0;}
  100%{transform:scale(1.16);opacity:0;}
}
.orb.is-hold::after{animation:none;opacity:0;}
.orb__halo{
  position:absolute;
  inset:14%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,226,160,.20), rgba(255,210,140,.06) 45%, transparent 68%);
  opacity:0;
  transition:opacity .9s ease;
  filter:blur(4px);
}
.orb__core{
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff8e8;
  box-shadow:0 0 18px 6px rgba(255,238,196,.75), 0 0 56px 16px rgba(255,208,132,.28);
  transition:box-shadow .4s ease, transform .4s var(--ease);
}
.orb.is-hold .orb__halo{opacity:1;}
.orb.is-hold .orb__core{transform:scale(1.35);}
.orb.is-done{pointer-events:none;}
.orb.is-done .orb__core{opacity:0;transition:opacity .3s ease;}

.hb-wrap{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  visibility:hidden;
  pointer-events:none;
  padding:0 6px;
}
.scene--wishmake.is-done .hb-wrap{visibility:visible;}
.hb{
  margin:0;
  font-family:var(--serif);
  font-size:clamp(38px,12.5vw,58px);
  line-height:1.42;
  letter-spacing:.16em;
  text-indent:.16em;
  color:#fff7e6;

        const p = ctx.createStereoPanner();
        p.pan.value = pan || 0;
        out.connect(p);
        tail = p;
      }
      tail.connect(musicBus);

      const parts = [
        [1, 1, 2.6],
        [2.002, 0.28, 1.5],
        [3.006, 0.09, 0.85],
        [5.02, 0.04, 0.45]
      ];
      const t = Math.max(when, ctx.currentTime);
      for (let i = 0; i < parts.length; i++) {
        const mul = parts[i][0];
        const amp = parts[i][1];
        const dec = parts[i][2] * clamp(dur / 1.1, 0.55, 2.4);
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq * mul;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(amp, t + 0.007);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
        osc.connect(g);
        g.connect(out);
        osc.start(t);
        osc.stop(t + dec + 0.05);
      }
    }

    function scheduleBar(i, t0) {
      const b = BARS[i];
      // 低音
      pluck(midi(b.root - 12), t0, 2.6, 0.075, -0.12);
      // 分解和弦
      for (let k = 0; k < ARP.length; k++) {
        pluck(
          midi(b.root + ARP[k]),
          t0 + (k * BEAT) / 2,
          1.1,
          k % 2 === 0 ? 0.032 : 0.022,
          k % 2 === 0 ? -0.3 : 0.3
        );
      }
      // 旋律
      for (let n = 0; n < b.notes.length; n++) {
        const note = b.notes[n];
        pluck(midi(note[1]), t0 + note[0] * BEAT, note[2] * BEAT, 0.115, 0.06);
      }
    }

    function tick() {
      if (!ctx || !enabled || ctx.state !== 'running') return;
      const now = ctx.currentTime;
      if (nextBar < now) nextBar = now + 0.08;
      while (nextBar < now + 0.9) {
        scheduleBar(bar, nextBar);
        nextBar += 3 * BEAT;
        bar = (bar + 1) % BARS.length;
      }
    }

    function start() {
      if (!ready) {
        if (!build()) return;
        ready = true;
      }
      if (ctx.state === 'suspended') ctx.resume();
      if (timer) return;
      bar = 0;
      nextBar = ctx.currentTime + 0.25;
      timer = setInterval(tick, 220);
      tick();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(0.0001, ctx.currentTime);
      master.gain.linearRampToValueAtTime(enabled ? 0.85 : 0.0001, ctx.currentTime + 3.2);
    }

    function setEnabled(v) {
      enabled = !!v;
      if (!ctx) {
        if (enabled) start();
        return;
      }
      if (enabled && ctx.state === 'suspended') ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), ctx.currentTime);
      master.gain.linearRampToValueAtTime(enabled ? 0.85 : 0.0001, ctx.currentTime + 0.7);
    }

    // 点星星的单音
    const PENTA = [62, 64, 66, 69, 71, 74, 76, 78, 81, 83, 86];
    function chime(i) {
      if (!ctx || !enabled) return;
      if (ctx.state === 'suspended') ctx.resume();
      const n = PENTA[(i * 3 + 2) % PENTA.length];
      pluck(midi(n), ctx.currentTime + 0.01, 1.2, 0.1, 0.1);
    }

    // 生日那一刻的上行音
    function flourish() {
      if (!ctx || !enabled) return;
      const t0 = ctx.currentTime + 0.05;
      const run = [62, 66, 69, 71, 74, 78, 81, 86];
      for (let i = 0; i < run.length; i++) {
        pluck(midi(run[i]), t0 + i * 0.085, 1.6, 0.085, (i / run.length) * 0.6 - 0.3);
      }
      const chord = [74, 78, 81, 86];
      for (let i = 0; i < chord.length; i++) {
        pluck(midi(chord[i]), t0 + 0.72, 3.2, 0.07, (i - 1.5) * 0.16);
      }
    }

    function tap() {
      if (!ctx || !enabled) return;
      pluck(midi(86), ctx.currentTime + 0.005, 0.6, 0.05, 0.2);
    }

    return {
      start,
      setEnabled,
      chime,
      flourish,
      tap,
      get enabled() {
        return enabled;
      }
    };

    /* ---------- 羽毛 ---------- */
    function buildFeather() {
      const w = 300;
      const h = 520;
      const s = 2;
      const c = document.createElement('canvas');
      c.width = w * s;
      c.height = h * s;
      const g = c.getContext('2d');
      g.scale(s, s);

      const cx = w / 2;
      const top = 58;
      const bot = h - 76;
      const L = bot - top;
      const rachis = (tt) => ({ x: cx + Math.sin(tt * Math.PI) * 7 - 3.5, y: top + tt * L });
      const prof = (tt) => Math.pow(Math.sin(Math.PI * Math.pow(tt, 0.8)), 0.55) * (1 - 0.08 * tt);
      const halfW = (tt) => prof(tt) * 94;
      const ANG = 0.72;

      function edgeAt(tt, side) {
        const q = rachis(tt);
        const len = halfW(tt);
        return {
          x: q.x + side * len * Math.cos(ANG),
          y: q.y + len * Math.sin(ANG) + prof(tt) * 10
        };
      }

      function vanePath(side) {
        const p = new Path2D();
        const p0 = rachis(0);
        p.moveTo(p0.x, p0.y);
        for (let i = 1; i <= 90; i++) {
          const e = edgeAt(i / 90, side);
          p.lineTo(e.x, e.y);
        }
        const p1 = rachis(1);
        p.lineTo(p1.x, p1.y);
        p.closePath();
        return p;
      }
      const leftVane = vanePath(-1);
      const rightVane = vanePath(1);
      const vaneAll = new Path2D();
      vaneAll.addPath(leftVane);
      vaneAll.addPath(rightVane);

      // 羽面底色
      g.fillStyle = 'rgba(255,233,192,.07)';

      g.fill(rightVane);

      // 羽枝纹理（贴着轮廓，向羽尖方向斜掠）
      g.save();
      g.clip(vaneAll);

      // 靠近羽轴的地方更亮
      const core = g.createLinearGradient(cx - 64, 0, cx + 64, 0);
      core.addColorStop(0, 'rgba(255,236,196,0)');
      core.addColorStop(0.5, 'rgba(255,242,208,.10)');
      core.addColorStop(1, 'rgba(255,236,196,0)');
      g.fillStyle = core;
      g.fillRect(0, 0, w, h);

      for (let side = -1; side <= 1; side += 2) {
        for (let i = 0; i < 360; i++) {
          const tt = (i + Math.random() * 0.9) / 360;
          const e = edgeAt(tt, side);
          const start = rachis(Math.min(1, tt + 0.045 + Math.random() * 0.02));
          const shrink = 0.86 + Math.random() * 0.16;
          const ex = start.x + (e.x - start.x) * shrink;
          const ey = start.y + (e.y - start.y) * shrink;
          const mx = (start.x + ex) / 2;

    /* ---------- 星座点采样 ---------- */
    function sampleGlyph(text, want) {
      const cw = 620;
      const ch = 340;
      const c = document.createElement('canvas');
      c.width = cw;
      c.height = ch;
      const g = c.getContext('2d');
      g.fillStyle = '#fff';

      let size = 216;
      g.font = '400 ' + size + 'px ' + SERIF;

      if (mw > cw * 0.86) {
        size *= (cw * 0.86) / mw;
        g.font = '400 ' + size + 'px ' + SERIF;
      }
      g.fillText(text, cw / 2, ch / 2 + size * 0.01);

      const data = g.getImageData(0, 0, cw, ch).data;
      const bins = new Map();
      const cell = 8;
      for (let y = 2; y < ch; y += 3) {
        for (let x = 2; x < cw; x += 3) {
          if (data[(y * cw + x) * 4 + 3] > 140) {
            const k = Math.floor(x / cell) + ',' + Math.floor(y / cell);
            if (!bins.has(k)) bins.set(k, [x, y]);
          }
        }
      }
      let pts = Array.from(bins.values());
      // 打散
      for (let i = pts.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const tmp = pts[i];
        pts[i] = pts[j];
        pts[j] = tmp;
      }
      if (pts.length > want) pts = pts.slice(0, want);
      return pts;
    }

    function updateFeather(dt) {

    /* ---------- 流星 ---------- */
    function spawnShoot(x, y, power) {

      const sp = rand(6, 9.5) * (power || 1);
      shoots.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 1,
        len: rand(70, 130)
      });
    }

    /* ---------- 粒子 ---------- */
    function spawnBurst(x, y, n, power) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.2832;
        const sp = rand(0.25, 0.95) * (power || 1);
        burst.push({
          x: x,
          y: y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1,
          decay: rand(0.01, 0.022),
          r: rand(0.55, 1.7),
          warm: Math.random() < 0.6
        });
      }
      if (burst.length > 700) burst.splice(0, burst.length - 700);
    }

    /* ---------- 绘制 ---------- */
    function drawSky(dt) {
      ctx.clearRect(0, 0, W, H);
      if (milky) {
        ctx.globalAlpha = 0.85;
        ctx.drawImage(milky, 0, 0, W, H);
        ctx.globalAlpha = 1;
      }

      for (let i = 0; i < stars.length; i++) {
        const st = stars[i];
        const tw = 0.62 + 0.38 * Math.sin(t * st.sp + st.ph);
        const a = st.a * tw;
        if (st.big) {
          star(st.x, st.y, st.r * 1.6, a, st.warm ? 1 : 0);
        } else {
          ctx.fillStyle = st.warm
            ? 'rgba(255,224,190,' + a.toFixed(3) + ')'
            : 'rgba(226,236,255,' + a.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.r, 0, 6.2832);
          ctx.fill();
        }
      }

      // 流星
      shootTimer -= dt;
      if (shootTimer <= 0 && !REDUCED) {
        shootTimer = rand(8000, 16000);
        spawnShoot(rand(W * 0.2, W * 0.95), rand(-20, H * 0.35), 1);
      }

      for (let i = shoots.length - 1; i >= 0; i--) {
        const s = shoots[i];
        s.x += s.vx * (dt / 16.7);
        s.y += s.vy * (dt / 16.7);
        s.life -= dt / 1100;
        if (s.life <= 0 || s.y > H + 200 || s.x < -300) {
          shoots.splice(i, 1);
          continue;
        }
        const sp = Math.hypot(s.vx, s.vy) || 1;
        const ux = s.vx / sp;
        const uy = s.vy / sp;
        const grd = ctx.createLinearGradient(s.x, s.y, s.x - ux * s.len, s.y - uy * s.len);
        grd.addColorStop(0, 'rgba(255,248,226,' + (0.85 * s.life).toFixed(3) + ')');
        grd.addColorStop(0.35, 'rgba(255,228,180,' + (0.32 * s.life).toFixed(3) + ')');
        grd.addColorStop(1, 'rgba(255,220,170,0)');
        ctx.strokeStyle = grd;
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - ux * s.len, s.y - uy * s.len);
        ctx.stroke();

        ctx.globalAlpha = s.life;
        ctx.fillStyle = 'rgba(255,250,232,.9)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, 1.3, 0, 6.2832);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // 星座
      if (constAlpha > 0.005) {
        const cy = H * 0.5;
        const rg = ctx.createRadialGradient(W / 2, cy, 0, W / 2, cy, W * 0.62);
        rg.addColorStop(0, 'rgba(120,150,220,' + (0.10 * constAlpha).toFixed(3) + ')');
        rg.addColorStop(1, 'rgba(120,150,220,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, W, H);

        const lp = smooth(0.45, 0.95, constProgress);
        if (lp > 0.01) {
          ctx.strokeStyle = 'rgba(214,232,255,' + (0.17 * lp * constAlpha).toFixed(3) + ')';
          ctx.lineWidth = 0.6;
          for (let i = 0; i < constLines.length; i++) {
            const a = constPts[constLines[i][0]];
            const b = constPts[constLines[i][1]];
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }

        for (let i = 0; i < constPts.length; i++) {
          const p = constPts[i];
          const local = easeOut(clamp((constProgress - p.delay) / (1 - p.delay), 0, 1));
          if (local <= 0.01) continue;
          const x = lerp(p.sx, p.x, local);
          const y = lerp(p.sy, p.y, local);
          const tw = 0.72 + 0.28 * Math.sin(t * 1.7 + i);
          const a = local * p.a * tw * constAlpha;
          star(x, y, p.r * 1.25 * constStarScale, a, 0);
        }
      }

      // 许愿的辉光
      if (glow > 0.01) {
        const cx = W / 2;
        const cy = H * 0.5;
        const r = 40 + glow * 220;
        const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        gg.addColorStop(0, 'rgba(255,240,205,' + (0.5 * glow).toFixed(3) + ')');
        gg.addColorStop(0.4, 'rgba(255,214,150,' + (0.16 * glow).toFixed(3) + ')');
        gg.addColorStop(1, 'rgba(255,200,130,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 6.2832);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }

      // 粒子
      for (let i = burst.length - 1; i >= 0; i--) {
        const p = burst[i];
        p.x += p.vx * (dt / 16.7) * 1.2;
        p.y += p.vy * (dt / 16.7) * 1.2;
        p.vx *= 0.988;
        p.vy = p.vy * 0.988 + 0.0025 * (dt / 16.7);
        p.life -= p.decay * (dt / 16.7);
        if (p.life <= 0) {
          burst.splice(i, 1);
          continue;
        }
        const a = p.life * 0.9;
        ctx.globalAlpha = a;
        const sz = p.r * 6;
        ctx.drawImage(glowSprite, p.x - sz, p.y - sz, sz * 2, sz * 2);
        ctx.globalAlpha = 1;
      }
    }

    function frame(now) {
      const dt = Math.min(56, Math.max(0, now - last));
      last = now;
      t += dt * 0.001;

      updateFeather(dt);
      constAlpha += (constTarget - constAlpha) * Math.min(1, dt * 0.004);
      if (constTarget > 0) {
        constProgress += (1 - constProgress) * Math.min(1, dt * 0.0022);
        if (INSTANT) constProgress = 1;
      }
      glow += (glowTarget - glow) * Math.min(1, dt * 0.006);

      drawSky(dt);
      drawFeather();

      for (let i = 0; i < frameHooks.length; i++) frameHooks[i](dt);

      raf = requestAnimationFrame(frame);
    }

    /* ---------- 交互 ---------- */
    function bindPointer() {
      const hit = (x, y) => {
        const dx = x - F.x;
        const dy = y - F.y;
        return Math.hypot(dx, dy) < Math.max(70, 150 * F.scale);
      };

      window.addEventListener(
        'pointerdown',
        (e) => {
          if (F.target < 0.4 || F.alpha < 0.3) return;
          if (!hit(e.clientX, e.clientY)) return;
          F.drag = true;
          F.pointer = e.pointerId;
          F.lastX = e.clientX;
          F.lastY = e.clientY;
          F.vx = 0;
          F.vy = 0;
          if (!F.grabbed) {
            F.grabbed = true;
            if (onGrab) onGrab();
          }
        },
        { passive: true }
      );

      window.addEventListener(
        'pointermove',
        (e) => {
          if (!F.drag || e.pointerId !== F.pointer) return;
          const dx = e.clientX - F.lastX;
          const dy = e.clientY - F.lastY;
          F.x = e.clientX;
          F.y = e.clientY;
          F.vx = dx * 0.55;
          F.vy = dy * 0.55;
          F.lastX = e.clientX;
          F.lastY = e.clientY;
          if (Math.random() < 0.45) spawnBurst(e.clientX, e.clientY, 1, 0.32);
          e.preventDefault();
        },
        { passive: false }
      );

      const end = (e) => {
        if (!F.drag || (e.pointerId !== undefined && e.pointerId !== F.pointer)) return;
        F.drag = false;
        F.pointer = null;
      };
      window.addEventListener('pointerup', end, { passive: true });
      window.addEventListener('pointercancel', end, { passive: true });

      window.addEventListener(
        'touchmove',
        (e) => {
          if (F.drag && e.cancelable) e.preventDefault();
        },
        { passive: false }
      );
    }

    return {
      init() {
        resize();
        bindPointer();
        window.addEventListener('resize', () => {
          clearTimeout(resize._t);
          resize._t = setTimeout(resize, 140);
        });
        window.addEventListener('orientationchange', () => setTimeout(resize, 220));
        last = performance.now();
        raf = requestAnimationFrame(frame);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            cancelAnimationFrame(raf);
          } else {
            last = performance.now();
            raf = requestAnimationFrame(frame);
          }
        });
      },
      onFrame(fn) {
        frameHooks.push(fn);
      },
      onGrab(fn) {
        onGrab = fn;
      },
      feather(alpha, anchor) {
        F.target = alpha;
        if (anchor) F.anchor = anchor;
        if (INSTANT) F.alpha = alpha;
      },
      constellation(v, restart) {
        constTarget = v;
        if (restart) constProgress = 0;
        if (v > 0 && INSTANT) {
          constAlpha = 1;
          constProgress = 1;
        }
      },
      glow(v) {
        glowTarget = v;
        if (INSTANT) glow = v;
      },
      burst: spawnBurst,
      shoot: spawnShoot,
      point(x, y) {
        spawnBurst(x, y, 14, 0.55);
      },
      stop() {
        cancelAnimationFrame(raf);
      }
    };
  })();

  /* =======================================================
     4. 星图证书
     ======================================================= */
  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function spacedText(g, text, x, y, sp, align) {
    const chars = Array.from(text);
    const widths = chars.map((ch) => g.measureText(ch).width);
    let total = 0;
    for (let i = 0; i < widths.length; i++) total += widths[i];
    total += sp * (chars.length - 1);
    let cx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
    const prev = g.textAlign;
    g.textAlign = 'left';
    for (let i = 0; i < chars.length; i++) {
      g.fillText(chars[i], cx, y);
      cx += widths[i] + sp;
    }
    g.textAlign = prev;
    return total;
  }

  function paintCert(g, W) {
    const k = W / 720;
    g.save();
    g.setTransform(k, 0, 0, k, 0, 0);
    const w = 720;
    const h = 960;

    /* 底 */
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#070b17');
    bg.addColorStop(0.5, '#0a1024');
    bg.addColorStop(1, '#050810');
    g.fillStyle = bg;
    g.fillRect(0, 0, w, h);

    const rg = g.createRadialGradient(w * 0.42, h * 0.3, 8, w * 0.42, h * 0.3, w * 0.9);
    rg.addColorStop(0, 'rgba(66,92,168,.30)');
    rg.addColorStop(0.55, 'rgba(38,50,100,.12)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, w, h);

    /* 星点（固定种子，显示与导出完全一致） */
    const rnd = mulberry(1121);
    for (let i = 0; i < 300; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const r = rnd() < 0.9 ? 0.4 + rnd() * 0.7 : 0.9 + rnd() * 0.9;
      const a = 0.1 + rnd() * 0.5;
      g.fillStyle = 'rgba(226,236,255,' + a.toFixed(3) + ')';
      g.beginPath();
      g.arc(x, y, r, 0, 6.2832);
      g.fill();
    }
    for (let i = 0; i < 26; i++) {
      const x = rnd() * w;
      const y = rnd() * h;
      const r = 8 + rnd() * 18;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, 'rgba(255,240,210,.09)');
      grd.addColorStop(1, 'rgba(255,240,210,0)');
      g.fillStyle = grd;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }

    /* 边框 */
    g.strokeStyle = 'rgba(201,168,106,.42)';
    g.lineWidth = 1;
    g.strokeRect(26, 26, w - 52, h - 52);
    g.strokeStyle = 'rgba(201,168,106,.14)';
    g.strokeRect(34, 34, w - 68, h - 68);

    const tick = (x, y, sx, sy) => {
      g.beginPath();
      g.moveTo(x, y + 12 * sy);
      g.lineTo(x, y);
      g.lineTo(x + 12 * sx, y);
      g.strokeStyle = 'rgba(201,168,106,.6)';
      g.lineWidth = 1.4;
      g.stroke();
    };
    tick(26, 26, 1, 1);
    tick(w - 26, 26, -1, 1);
    tick(26, h - 26, 1, -1);
    tick(w - 26, h - 26, -1, -1);

    /* 抬头 */
    g.fillStyle = 'rgba(201,168,106,.8)';
    g.font = '400 17px ' + SANS;
    spacedText(g, C.cert.kicker, 62, 76, 5.6, 'left');

    g.fillStyle = 'rgba(236,230,218,.34)';
    g.font = '400 16px ' + SANS;
    spacedText(g, C.cert.no, 658, 76, 2.4, 'right');

    /* 标题 */
    g.fillStyle = '#f7f0e0';
    g.font = '400 62px ' + SERIF;
    spacedText(g, C.cert.title, 360, 160, 22, 'center');

    /* 分隔线 */
    const ln = g.createLinearGradient(96, 0, 624, 0);
    ln.addColorStop(0, 'rgba(201,168,106,0)');
    ln.addColorStop(0.5, 'rgba(201,168,106,.55)');
    ln.addColorStop(1, 'rgba(201,168,106,0)');
    g.strokeStyle = ln;
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(96, 194);
    g.lineTo(624, 194);
    g.stroke();

    /* 星图面板 */
    const px = 64;
    const py = 214;
    const pw = 592;
    const ph = 300;
    g.fillStyle = 'rgba(255,255,255,.014)';
    g.fillRect(px, py, pw, ph);
    g.strokeStyle = 'rgba(201,168,106,.16)';
    g.strokeRect(px, py, pw, ph);

    // 猎户座（等比，居中偏右）
    const OW = 278;
    const OH = 288;
    const ox = px + pw * 0.575 - OW / 2;
    const oy = py + ph * 0.52 - OH / 2 + 2;
    const Q = (nx, ny) => [ox + nx * OW, oy + ny * OH];

    const orion = {
      betel: [0.30, 0.20],
      bella: [0.70, 0.22],
      alnit: [0.42, 0.50],
      alnil: [0.52, 0.49],
      mint: [0.62, 0.48],
      saiph: [0.38, 0.82],
      rigel: [0.70, 0.85]
    };
    const edges = [
      ['betel', 'bella'],
      ['betel', 'alnit'],
      ['bella', 'mint'],
      ['alnit', 'alnil'],
      ['alnil', 'mint'],
      ['alnit', 'saiph'],
      ['mint', 'rigel']
    ];
    g.strokeStyle = 'rgba(201,168,106,.20)';
    g.lineWidth = 0.9;
    edges.forEach((e) => {
      const a = Q.apply(null, orion[e[0]]);
      const b = Q.apply(null, orion[e[1]]);
      g.beginPath();
      g.moveTo(a[0], a[1]);
      g.lineTo(b[0], b[1]);
      g.stroke();
    });

    Object.keys(orion).forEach((key) => {
      const p = Q.apply(null, orion[key]);
      const isBetel = key === 'betel';
      const isRigel = key === 'rigel';
      const rr = isBetel || isRigel ? 2.9 : 2.1;
      if (isBetel) {
        const gg = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], 18);
        gg.addColorStop(0, 'rgba(255,170,130,.34)');
        gg.addColorStop(1, 'rgba(255,170,130,0)');
        g.fillStyle = gg;
        g.fillRect(p[0] - 18, p[1] - 18, 36, 36);
      }
      g.beginPath();
      g.arc(p[0], p[1], rr, 0, 6.2832);
      g.fillStyle = isBetel ? 'rgba(255,178,140,.95)' : 'rgba(255,246,230,.72)';
      g.fill();
    });

    g.fillStyle = 'rgba(236,230,218,.38)';
    g.font = '400 15px ' + SANS;
    spacedText(g, '参宿四', Q(0.30, 0.20)[0] - 40, Q(0.30, 0.20)[1] + 22, 1.6, 'center');
    spacedText(g, '猎户座', px + pw - 16, py + ph - 14, 2.6, 'right');

    // 指北针
    const knx = px + 24;
    const kny = py + ph - 24;
    g.strokeStyle = 'rgba(201,168,106,.24)';
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(knx, kny);
    g.lineTo(knx, kny - 17);
    g.stroke();
    g.beginPath();
    g.moveTo(knx - 3.4, kny - 12);
    g.lineTo(knx, kny - 17);
    g.lineTo(knx + 3.4, kny - 12);
    g.stroke();
    g.fillStyle = 'rgba(201,168,106,.34)';
    g.font = '400 11px ' + SANS;
    spacedText(g, 'N', knx, kny + 12, 1, 'center');

    /* 思羽：一小片羽毛形状的星 */
    const featherStars = [
      [0, -52], [12, -34], [20, -14], [20, 6], [12, 24], [2, 36],
      [-10, 28], [-20, 10], [-22, -10], [-14, -32], [-4, -46], [0, -16]
    ];
    const cxa = px + 132;
    const cya = py + 148;
    const pts = featherStars.map((d) => [cxa + d[0], cya + d[1]]);

    // 虚线：从思羽连到参宿四
    g.save();
    g.setLineDash([2, 5]);
    g.strokeStyle = 'rgba(255,230,190,.20)';
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(cxa + 26, cya - 6);
    g.lineTo(Q(0.30, 0.20)[0] - 10, Q(0.30, 0.20)[1] + 8);
    g.stroke();
    g.restore();

    g.strokeStyle = 'rgba(255,236,196,.32)';
    g.lineWidth = 0.8;
    g.beginPath();
    pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
    g.stroke();

    const halo = g.createRadialGradient(pts[0][0], pts[0][1], 0, pts[0][0], pts[0][1], 26);
    halo.addColorStop(0, 'rgba(255,232,180,.24)');
    halo.addColorStop(1, 'rgba(255,232,180,0)');
    g.fillStyle = halo;
    g.fillRect(pts[0][0] - 26, pts[0][1] - 26, 52, 52);

    pts.forEach((p, i) => {
      g.beginPath();
      g.arc(p[0], p[1], i === 0 ? 3 : 1.9, 0, 6.2832);
      g.fillStyle = 'rgba(255,248,226,.92)';
      g.fill();
    });

    g.fillStyle = 'rgba(255,238,200,.9)';
    g.font = '400 20px ' + SERIF;
    spacedText(g, '思羽', cxa, cya - 72, 3, 'center');

    /* 信息 */
    const rows = [
      [C.cert.nameLabel, C.cert.name],
      [C.cert.codeLabel, C.cert.code],
      [C.cert.whereLabel, C.cert.where],
      [C.cert.whenLabel, C.cert.when],
      [C.cert.giverLabel, C.cert.giver]
    ];
    rows.forEach((row, i) => {
      const y = 574 + i * 50;
      g.fillStyle = 'rgba(201,168,106,.58)';
      g.font = '400 17px ' + SANS;
      spacedText(g, row[0], 92, y, 5, 'left');
      g.fillStyle = i === 0 ? '#fbf3e2' : 'rgba(240,232,214,.86)';
      g.font = '400 ' + (i === 0 ? 34 : 28) + 'px ' + SERIF;
      spacedText(g, row[1], 240, y, i === 0 ? 6 : 1.8, 'left');
      if (i < 4) {
        g.strokeStyle = 'rgba(236,230,218,.07)';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(92, y + 19);
        g.lineTo(560, y + 19);
        g.stroke();
      }
    });

    /* 印章 */
    g.save();
    g.translate(598, 806);
    g.rotate(-0.045);
    g.fillStyle = 'rgba(168,57,44,.92)';
    g.fillRect(-44, -44, 88, 88);
    g.strokeStyle = 'rgba(255,235,225,.42)';
    g.lineWidth = 1;
    g.strokeRect(-38, -38, 76, 76);
    g.fillStyle = 'rgba(255,240,232,.94)';
    g.font = '400 30px ' + SERIF;
    g.textAlign = 'center';
    g.fillText('思', 0, -3);
    g.fillText('羽', 0, 29);
    g.textAlign = 'left';
    g.restore();

    /* 页脚 */
    g.fillStyle = 'rgba(236,230,218,.42)';
    g.font = '400 18px ' + SERIF;
    spacedText(g, C.cert.note, 360, 898, 1.4, 'center');

    g.restore();
  }

  /* =======================================================
     5. 场景
     ======================================================= */
  const stage = document.getElementById('stage');
  const scenes = [];
  let current = -1;
  let timers = [];
  let txToken = 0;

  function later(fn, ms) {
    const tok = txToken;
    const id = setTimeout(() => {
      if (tok === txToken) fn();
    }, ms);
    timers.push(id);
    return id;
  }
  function clearLater() {
    timers.forEach(clearTimeout);
    timers = [];
    txToken++;
  }

  function makeScene(cls, inner) {
    const el = document.createElement('section');
    el.className = 'scene ' + cls;
    el.innerHTML = '<div class="scene__inner">' + inner + '</div>';
    stage.appendChild(el);

  const certEl = makeScene(
    'scene--cert',
    '<div class="cert"><canvas id="certCanvas" width="720" height="960" role="img" aria-label="星图证书"></canvas></div>' +
      '<div class="cert__actions"><button class="btn" id="saveCert" type="button">' + C.cert.save + '</button></div>'
  );

  const certCanvas = $('#certCanvas', certEl);
  function renderCert() {
    const g = certCanvas.getContext('2d');
    paintCert(g, 720);
  }
  renderCert();

  function openSheet(url) {
    let sheet = $('.sheet');
    if (!sheet) {
      sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.innerHTML =
        '<img alt="' + C.cert.title + '" />' +
        '<p>' + C.cert.saveHint + '</p>' +
        '<a download="' + C.her + '-星空证书.png">下载原图</a>' +
        '<button class="sheet__close" type="button">合上</button>';
      sheet.addEventListener('click', (e) => {
        if (e.target === sheet || e.target.className === 'sheet__close') {
          sheet.classList.remove('is-on');
        }
      });
      document.body.appendChild(sheet);
    }
    $('img', sheet).src = url;
    $('a', sheet).href = url;
    requestAnimationFrame(() => sheet.classList.add('is-on'));
  }

  $('#saveCert', certEl).addEventListener('click', () => {
    const out = document.createElement('canvas');
    out.width = 1440;
    out.height = 1920;
    const g = out.getContext('2d');
    paintCert(g, 1440);
    const url = out.toDataURL('image/png');
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
      openSheet(url);
      return;
    }
    const a = document.createElement('a');
    a.href = url;
    a.download = C.her + '-星空证书.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    openSheet(url);
  });

  /* ---- 6 许愿 ---- */
  const makeEl = makeScene(
    'scene--wishmake',
    '<div class="wishmake__stage">' +
      '<div class="wish__head">' +
      '<p class="line rise" style="--d:60ms">' + C.wishMake[0] + '</p>' +
      '<p class="line rise" style="--d:420ms">' + C.wishMake[1] + '</p>' +
      '</div>' +
      '<button class="orb" id="orb" type="button" aria-label="按住许愿">' +
      '<span class="orb__halo"></span>' +
      '<svg class="orb__ring" viewBox="0 0 200 200" aria-hidden="true">' +
      '<circle class="orb__track" cx="100" cy="100" r="96"/>' +
      '<circle class="orb__prog" cx="100" cy="100" r="96"/>' +
      '</svg>' +
      '<span class="orb__core"></span>' +
      '</button>' +
      '<p class="hint" id="holdHint">' + C.holdHint + '</p>' +
      '</div>' +
      '<div class="hb-wrap" id="hbWrap">' +
      '<p class="hb">' + C.hbLine1 + '<br>' + C.hbLine2 + '</p>' +
      '<p class="hb-sub">' + C.hbSub + '</p>' +
      '</div>'
  );

  const orb = $('#orb', makeEl);
  const orbRing = $('.orb__prog', makeEl);
  const holdHint = $('#holdHint', makeEl);
  const hbWrap = $('#hbWrap', makeEl);
  const CIRC = 2 * Math.PI * 96;
  orbRing.style.strokeDasharray = CIRC;
  orbRing.style.strokeDashoffset = CIRC;

  let holdProg = 0;
  let holding = false;
  let holdDone = false;

  Sky.onFrame((dt) => {
    if (holdDone || current !== 8) return;
    if (holding) {
      holdProg = Math.min(1, holdProg + dt / 1700);
      if (holdProg > 0.12) holdHint.classList.add('is-gone');
    } else if (holdProg > 0) {
      holdProg = Math.max(0, holdProg - dt / 480);
    }
    orbRing.style.strokeDashoffset = CIRC * (1 - holdProg);
    Sky.glow(holdProg * 0.9);
    if (holdProg >= 1) completeHold();
  });

  function completeHold() {
    if (holdDone) return;
    holdDone = true;
    holding = false;
    orb.classList.add('is-done');
    holdHint.classList.add('is-gone');
    makeEl.classList.add('is-done');
    const r = orb.getBoundingClientRect();
    Sky.burst(r.left + r.width / 2, r.top + r.height / 2, REDUCED ? 40 : 150, 1.8);
    later(() => Sky.burst(window.innerWidth * 0.32, window.innerHeight * 0.34, 60, 1.3), 260);
    later(() => Sky.burst(window.innerWidth * 0.7, window.innerHeight * 0.6, 60, 1.3), 460);
    Sound.flourish();
    buzz([14, 40, 90]);
    later(() => {
      hbWrap.classList.add('is-on');
    }, 500);
    later(() => Sky.glow(0), 1400);
    later(() => {
      Sky.shoot(window.innerWidth * 0.9, window.innerHeight * 0.05, 1.3);
    }, 1500);
  }

  function startHold(e) {
    if (holdDone) return;
    holding = true;
    orb.classList.add('is-hold');
    if (e && e.cancelable) e.preventDefault();
  }
  function endHold() {
    if (holdDone) return;
    holding = false;
    orb.classList.remove('is-hold');
    if (holdProg < 0.9) {
      holdHint.classList.remove('is-gone');
    }
  }
  orb.addEventListener('pointerdown', startHold);
  window.addEventListener('pointerup', endHold);
  window.addEventListener('pointercancel', endHold);
  orb.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') startHold(e);
  });
  orb.addEventListener('keyup', endHold);

  /* ---- 7 尾声 ---- */
  const endEl = makeScene(
    'scene--end',
    C.endLines
      .map(
        (line, i) =>
          '<p class="line rise" style="--d:' + (120 + i * 520) + 'ms">' + line + '</p>'
      )
      .join('') +
      '<p class="end__sign rise" style="--d:' + (120 + C.endLines.length * 520) + 'ms">' + C.endSign + '</p>' +
      '<div class="end__replay rise" style="--d:' + (420 + C.endLines.length * 520) + 'ms">' +
      '<button class="btn btn--ghost" id="replay" type="button">' + C.replay + '</button>' +
      '</div>' +
      '<p class="egg__line" id="eggLine">' + C.egg + '</p>' +
      '<button class="egg" id="egg" type="button" aria-label="一片羽毛">✦</button>'
  );
  let eggClicks = 0;
  $('#egg', endEl).addEventListener('click', () => {
    eggClicks++;
    if (eggClicks >= 3) {
      $('#eggLine', endEl).classList.add('is-on');
      Sky.burst(window.innerWidth / 2, window.innerHeight * 0.86, 18, 0.6);
    }
  });
  $('#replay', endEl).addEventListener('click', () => {
    $('#eggLine', endEl).classList.remove('is-on');
    eggClicks = 0;
    go(0);
  });

  /* ---- 场景注册 ---- */
  scenes.push({
    el: coverEl,
    enter() {
      opening = false;
      const sealEl = $('#seal', coverEl);
      if (sealEl) sealEl.classList.remove('is-open');
      Sky.feather(0);
      Sky.constellation(0);
      Sky.glow(0);
    }
  });

  scenes.push({
    el: prologueEl,
    enter() {
      Sky.feather(1, 'low');
      Sky.constellation(0);
      Sky.glow(0);
      $('#dragHint', prologueEl).classList.remove('is-gone');
      later(() => Sky.shoot(window.innerWidth * 0.8, -10, 0.8), 2400);
    },
    leave() {
      Sky.feather(0.55);
    }
  });

  scenes.push({
    el: constEl,
    enter() {
      Sky.feather(0);
      Sky.glow(0);
      Sky.constellation(1, true);
      const now = $('#constNow', constEl);
      const meta = $('#constMeta', constEl);
      later(() => {
        now.style.opacity = '1';
        meta.style.opacity = '1';
      }, REDUCED ? 300 : 2100);
      later(() => Sky.shoot(window.innerWidth * 0.92, window.innerHeight * 0.08, 0.9), 3200);
    },
    leave() {
      Sky.constellation(0);
    }
  });

  scenes.push({
    el: firstEl,
    enter() {
      Sky.feather(0);
      Sky.constellation(0);
      Sky.glow(0);
      firstAnim = 0;
      firstReady = false;
      firstCountEl.style.opacity = '0';
      firstCountEl.innerHTML = C.first.counter + '<b>1</b>' + C.first.counterUnit;
      if (INSTANT) {
        firstAnim = 1;
        firstCountEl.style.opacity = '1';
        firstCountEl.innerHTML = C.first.counter + '<b>' + meetDays + '</b>' + C.first.counterUnit;
      } else {
        later(() => {
          firstReady = true;
          firstCountEl.style.opacity = '1';
        }, 900);
      }
    }
  });

  scenes.push({
    el: twoEl,
    enter() {
      Sky.feather(0);
      Sky.constellation(0);
      Sky.glow(0);
      twoFootEl.textContent = reunionText();
      mapBase = null;
      mapBaseW = 0;
      requestAnimationFrame(() => paintMap(0));
    }
  });

  scenes.push({
    el: wishEl,
    enter() {
      Sky.feather(0);
      Sky.constellation(0);
    },
    leave() {}
  });

  scenes.push({
    el: letterEl,
    enter() {
      Sky.feather(0, 'corner');
      Sky.constellation(0);
      Sky.glow(0);
    }
  });

  scenes.push({
    el: certEl,
    enter() {
      Sky.feather(0, 'corner');
      Sky.constellation(0);
      Sky.glow(0);
      renderCert();
    }
  });

  scenes.push({
    el: makeEl,
    enter() {
      holdProg = 0;
      holdDone = false;
      holding = false;
      holdHint.classList.remove('is-gone');
      orb.classList.remove('is-hold', 'is-done');
      hbWrap.classList.remove('is-on');
      makeEl.classList.remove('is-done');
      orbRing.style.strokeDashoffset = CIRC;
      Sky.feather(0);
      Sky.constellation(0);
      Sky.glow(0);
      if (params.get('done') === '1') {
        holdProg = 1;
        later(completeHold, 300);
      }
    },
    leave() {
      Sky.glow(0);
      holding = false;
    }
  });

  scenes.push({
    el: endEl,
    enter() {
      Sky.feather(0.55, 'end');
      Sky.constellation(0);
      Sky.glow(0);
      later(() => Sky.shoot(window.innerWidth * 1.02, -20, 0.8), 1800);
    }
  });

  /* =======================================================
     6. 调度
     ======================================================= */
  Sky.onFrame((dt) => {
    if (current === 4) paintMap(dt);
  });

  Sky.onFrame((dt) => {
    if (current !== 3 || !firstReady || firstAnim >= 1) return;
    firstAnim = Math.min(1, firstAnim + dt / 1500);
    const v = Math.round(1 + (meetDays - 1) * easeOut(firstAnim));
    firstCountEl.innerHTML = C.first.counter + '<b>' + v + '</b>' + C.first.counterUnit;
  });

  const idxEl = document.getElementById('idx');
  const totalEl = document.getElementById('total');
  if (totalEl) totalEl.textContent = pad2(scenes.length);
  const navEl = document.querySelector('.nav');
  const nextBtn = document.getElementById('next');
  const soundBtn = document.getElementById('sound');

  function go(i, instant) {
    i = clamp(i, 0, scenes.length - 1);
    if (i === current) return;
    const prev = current >= 0 ? scenes[current] : null;
    const next = scenes[i];

    clearLater();
    if (prev) {
      prev.el.classList.remove('is-on');
      prev.el.classList.add('is-past');
      if (prev.leave) prev.leave();
    }
    current = i;
    next.el.classList.remove('is-past');
    // 强制回流，保证动画可重放
    void next.el.offsetWidth;
    next.el.classList.add('is-on');
    if (next.enter) next.enter();

    idxEl.textContent = pad2(i + 1);
    const showNav = i > 0 && i < scenes.length - 1;
    navEl.classList.toggle('is-hidden', !showNav);
    if (showNav) {
      nextBtn.classList.add('is-breathe');
      setTimeout(() => nextBtn.classList.remove('is-breathe'), 4200);
    }
    document.querySelector('.hud').style.opacity = i === 0 ? '0.9' : '1';
  }

  nextBtn.addEventListener('click', () => {
    Sound.tap();
    go(current + 1);
  });

  soundBtn.addEventListener('click', () => {
    const on = soundBtn.getAttribute('aria-pressed') !== 'true';
    soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', on ? '关闭音乐' : '打开音乐');
    Sound.setEnabled(on);
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
      if (e.target && /button|input|textarea/i.test(e.target.tagName)) return;
      e.preventDefault();
      go(current + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      go(current - 1);
    }
  });

  let wheelLock = 0;
  window.addEventListener(
    'wheel',
    (e) => {
      const now = Date.now();
      if (now < wheelLock) return;
      if (Math.abs(e.deltaY) < 16) return;
      const sc = current >= 0 ? scenes[current].el : null;
      if (sc && sc.scrollHeight > sc.clientHeight + 4) {
        const atBottom = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 6;
        const atTop = sc.scrollTop <= 4;
        if ((e.deltaY > 0 && !atBottom) || (e.deltaY < 0 && !atTop)) return;
      }
      wheelLock = now + 900;
      go(current + (e.deltaY > 0 ? 1 : -1));
    },
    { passive: true }
  );

  let tx = 0;
  let ty = 0;
  let tt0 = 0;
  stage.addEventListener(
    'touchstart',
    (e) => {
      if (e.touches.length !== 1) return;
      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
      tt0 = Date.now();
    },
    { passive: true }
  );
  stage.addEventListener(
    'touchend',
    (e) => {
      const t2 = e.changedTouches[0];
      if (!t2) return;
      const dx = t2.clientX - tx;
      const dy = t2.clientY - ty;
      if (Date.now() - tt0 < 800 && Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.7) {
        go(current + (dx < 0 ? 1 : -1));
      }
    },
    { passive: true }
  );

  /* =======================================================
     7. 启动
     ======================================================= */
  if (INSTANT) document.body.classList.add('no-anim');
  Sky.init();

  if (SCENE_PARAM !== null) {
    go(SCENE_PARAM, true);
    if (SCENE_PARAM === 0) opening = true;
  } else {
    go(0);
  }

  if (params.get('diag') === '1') {
    setTimeout(() => {
      const hb = document.querySelector('.hb');
      const scene = document.querySelector('.scene--wishmake');
      if (!hb || !scene) return;
      const cs = getComputedStyle(hb);
      document.title = 'hb:' + cs.opacity + ',' + cs.visibility + ' scene:' + getComputedStyle(scene).opacity;
    }, 1500);
  }

  if (DEV) {
    window.__dbg = { paintMap, MAP, get current() { return current; } };
  }
  if (params.get('cert') === '1') {
    const out = document.createElement('canvas');
    out.width = 1440;
    out.height = 1920;
    paintCert(out.getContext('2d'), 1440);
    openSheet(out.toDataURL('image/png'));
  }
})();
</script>
</body>
</html>
